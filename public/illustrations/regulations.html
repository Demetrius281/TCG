@keyframes rg-ring{to{stroke:var(--color-accent)}}

.rg-anim{transition:opacity .45s ease}
.rg.rg-out .rg-anim{opacity:0}

<title id="rg-t">Simplified compliance chain for a Bali rental property</title>
<desc id="rg-d">Six compliance layers stack from the ground up: land, zoning, building, business, licensing and operation, each with its main documents. Regulations on the right connect to the layers they govern: PP 21/2021 and Perda Bali 3–4/2026 to zoning, PP 16/2021 to building, PP 28/2025 to business and licensing, KBLI 2025 to licensing, Perda Bali 3–4/2026 to business, and Permenpar 6/2025 to operation. A line then runs up the chain, confirming each layer in turn. Only when all six are confirmed does the result appear: legal short-term rental. Simplified overview, not legal advice.</desc>
