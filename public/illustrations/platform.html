<title id="ip-t">Concept preview of the TCG property intelligence system</title>
<desc id="ip-d">A sample land parcel on a topographic base map near a coastline. Three data layers rise above it: zoning, constraints such as a coastal setback and protected rice fields, and property documents. A vertical beam passes through the stack at the parcel: zoning is marked as likely permitted, the coastal setback is marked as requiring review, and the document set is marked as incomplete. The findings flow into an intelligence engine, which produces a snapshot with land-use screening, document review and risk assessment statuses and confidence levels. Concept preview with sample data, not a legal verification or investment recommendation.</desc>
