<style>
  .pk {
    /* One layer step of the isometric stack, in SVG user units (1 unit = 1 css px at root 16px). */
    --ly-step: calc(var(--space-16) - var(--space-1) / 2);
    margin: 0;
    position: relative;
    min-width: 0;
    height: calc(var(--space-16) * 8);
  }
  .pk-svg { display: block; width: 100%; height: 100%; overflow: hidden; }



.pk-svg{display:block;width:100%;height:100%;overflow:hidden}
.pk-svg text{text-rendering:geometricPrecision}
.pk-tag{font-family:var(--font-mono);font-size:var(--fs-label);letter-spacing:.08em;fill:var(--color-text-3)}
.pk-co{font-family:var(--font-mono);font-size:var(--fs-label);letter-spacing:.04em;fill:var(--color-text);font-variant-numeric:tabular-nums;animation:pk-fade .4s ease-out .2s both}
.pk .sx,.pk .sx2{stroke:var(--color-text);stroke-width:.6;stroke-linejoin:round}
.pk .sx{fill:var(--color-sunken)}
.pk .sx2{fill:var(--color-border-strong)}
.pk-base .sx,.pk-base .sx2{animation:pk-fade .6s ease-out .1s both}
.pk .pl{fill:var(--color-surface);stroke:var(--color-text);stroke-width:.85;stroke-linejoin:round;animation:pk-draw .83s cubic-bezier(.45,0,.2,1) 0s both,pk-fill .53s ease-out .47s both}
.pk .ct{fill:none;stroke:var(--color-text-3);stroke-width:.55;stroke-opacity:.55;animation:pk-draw 1.1s cubic-bezier(.45,0,.2,1) var(--d,0s) both}
.pk .cl{fill:none;stroke:var(--color-accent);stroke-width:.8;animation:pk-draw 1.1s cubic-bezier(.45,0,.2,1) var(--d,0s) both}
.pk .sea{fill:none;stroke:var(--color-accent);stroke-width:.5;stroke-opacity:.4;animation:pk-fade .6s ease-out .9s both}
.pk .pq{fill:var(--color-accent);fill-opacity:.07;stroke:var(--color-text);stroke-width:1.1;stroke-linejoin:round;animation:pk-draw .8s cubic-bezier(.45,0,.2,1) .95s both,pk-fill .5s ease-out 1.5s both}
.pk .ly{animation:pk-rise .95s cubic-bezier(.2,.7,.3,1) var(--d,0s) both}
.pk .lp{fill:var(--color-surface);fill-opacity:.74;stroke:var(--color-text);stroke-width:.7;stroke-linejoin:round}
.pk .z1{fill:var(--color-accent);fill-opacity:.2}
.pk .z2{fill:var(--color-sunken)}
.pk .z3{fill:var(--color-bg)}
.pk .zs{fill:var(--color-accent);fill-opacity:.08}
.pk .z1,.pk .z2,.pk .z3,.pk .zs{stroke:var(--color-text-3);stroke-width:.5}
.pk .hb{fill:none;stroke:var(--color-warn);stroke-width:.5;stroke-opacity:.5}
.pk .sb{fill:none;stroke:var(--color-warn);stroke-width:.8;stroke-dasharray:3 2}
.pk .rf{fill:var(--color-text-3);fill-opacity:.05;stroke:var(--color-text-3);stroke-width:.6;stroke-dasharray:2 2}
.pk .ov{fill:var(--color-warn);fill-opacity:.28;stroke:var(--color-warn);stroke-width:.9;stroke-linejoin:round;animation:pk-fade .5s ease-out 4.25s both}
.pk .dc{fill:var(--color-surface);stroke:var(--color-text);stroke-width:.6}
.pk .dm{fill:none;stroke:var(--color-text-3);stroke-width:.7;stroke-dasharray:2 2}
.pk .dl{fill:none;stroke:var(--color-text-3);stroke-width:.5}
.pk .lk{fill:none;stroke:var(--color-text-3);stroke-width:.5;stroke-dasharray:1.5 1.5}
.pk .pd{fill:none;stroke:var(--color-text);stroke-width:.7;stroke-dasharray:3 2}

.pk-pin .pn{fill:var(--color-accent)}
.pk-pin .pr{fill:none;stroke:var(--color-accent);stroke-width:.9}
.pk .bm{fill:var(--color-accent);fill-opacity:.06;animation:pk-fade .4s ease-out 3.6s both,pk-beam 1.6s ease-out 3.6s both}
.pk .bl{fill:none;stroke:var(--color-accent);stroke-width:1;animation:pk-draw .9s cubic-bezier(.45,0,.2,1) 3.6s both}
.pk .hit{transform-box:fill-box;transform-origin:center;animation:pk-pop .5s cubic-bezier(.2,.7,.3,1) var(--d,0s) both}
.pk .hr{fill:var(--color-bg);fill-opacity:.85;stroke-width:1.1}
.pk .ok .hr{stroke:var(--color-accent)}.pk .ok .hc{fill:var(--color-accent)}
.pk .am .hr{stroke:var(--color-warn)}.pk .am .hc{fill:var(--color-warn)}
.pk .gy .hr{stroke:var(--color-text-3)}.pk .gy .hc{fill:var(--color-text-3)}
.pk .fl{fill:none;stroke:var(--color-text-3);stroke-width:.7;animation:pk-draw .9s cubic-bezier(.45,0,.2,1) var(--d,0s) both}
.pk .pkt{fill:none;stroke:var(--color-accent);stroke-width:1.6;stroke-linecap:round;stroke-dasharray:2 14;animation:pk-fade .4s ease-out var(--d,0s) both,pk-flow 1.2s linear var(--d,0s) infinite}

.pk-eng .hx{fill:var(--color-surface);stroke:var(--color-text);stroke-width:.9;stroke-linejoin:round}
.pk-eng .core{fill:var(--color-accent)}
.pk-rot{transform-box:fill-box;transform-origin:center;fill:none;stroke:var(--color-accent);stroke-width:.8;stroke-dasharray:2.5 2;animation:pk-fade .5s ease-out 5.6s both,pk-spin 6s linear 5.55s infinite}
.pk .el{font-family:var(--font-mono);font-size:var(--fs-label);letter-spacing:.06em;fill:var(--color-text);text-anchor:end;animation:pk-fade .53s ease-out 5.8s both}
.pk .lnk{fill:none;stroke:var(--color-text-3);stroke-width:.7;animation:pk-draw .6s cubic-bezier(.45,0,.2,1) 6.5s both}
.pk .rule{fill:none;stroke:var(--color-text);stroke-width:.7;animation:pk-draw .83s cubic-bezier(.45,0,.2,1) 6.8s both}
.pk .lb,.pk .sl,.pk .hd{font-family:var(--font-mono);font-size:var(--fs-label);letter-spacing:.06em;fill:var(--color-text)}
.pk .sl{letter-spacing:.02em;fill:var(--color-text-3)}
.pk .hd{fill:var(--color-text-3);letter-spacing:.08em;animation:pk-fade .53s ease-out 6.9s both}
.pk .row{animation:pk-fade .53s ease-out var(--d,0s) both}
.pk .tr{fill:none;stroke:var(--color-border);stroke-width:2}
.pk .cf{fill:none;stroke:var(--color-accent);stroke-width:2;animation:pk-draw .8s cubic-bezier(.45,0,.2,1) calc(var(--d,0s) + .2s) both}
.pk .nt{font-family:var(--font-sans);font-size:var(--fs-label);fill:var(--color-text-3);animation:pk-fade .71s ease-out 7.9s both}
@keyframes pk-draw{from{stroke-dasharray:1 1;stroke-dashoffset:1}to{stroke-dasharray:1 1;stroke-dashoffset:0}}
@keyframes pk-fill{from{fill-opacity:0}}
@keyframes pk-fade{from{opacity:0}}
@keyframes pk-rise{from{opacity:0;transform:translateY(var(--ty))}30%{opacity:1}}
@keyframes pk-drop{from{opacity:0;transform:translateY(calc(var(--space-4) * -0.875))}}
@keyframes pk-pop{from{opacity:0;transform:scale(.4)}}
@keyframes pk-beam{0%{fill-opacity:.16}100%{fill-opacity:.06}}
@keyframes pk-flow{to{stroke-dashoffset:-16}}
@keyframes pk-spin{to{transform:rotate(360deg)}}
.pk-anim{transition:opacity .45s ease}
.pk.pk-out .pk-anim{opacity:0}
@media (prefers-reduced-motion: reduce){.pk *{animation:none !important}.pk.pk-out .pk-anim{opacity:1}}

.pk .st-ok{fill:var(--color-accent)}.pk .st-am{fill:var(--color-warn)}

<title id="pk-t">Illustrative preliminary due diligence of a sample parcel</title>
<desc id="pk-d">A sample land parcel on a topographic base map in Badung. Four record layers are stacked above it: zoning under the RDTR, building approvals (PBG and SLF), the company registry (AHU) and business licensing (OSS and NIB). A vertical beam passes through the parcel and marks each layer: zoning verified, a building function that differs from the permit marked as a risk, the seller company verified and the licence record not verified. The findings flow into a sample report with a status for each record. Sample data, not an assessment of a real property.</desc>
