  # 9. FAQ
  - type: faq
    title: Frequently Asked Questions
    items:
      - question: Can a foreigner own a villa in Bali?
        answer: Foreigners cannot directly own Hak Milik (freehold) land in Indonesia. Depending on eligibility, lawful alternatives include Hak Pakai, a lease or ownership through an eligible PT PMA structure. Holding property rights and operating a rental business are separate legal matters.
        href: /regulations#fo-h
        linkText: Explore Foreign Ownership Regulations
      - question: My land is held by an Indonesian nominee. What is the risk?
        answer: A nominee arrangement can put your investment at risk. The Indonesian certificate holder remains the registered owner, while agreements designed to give a foreigner effective freehold ownership may be legally invalid. Bali’s Perda No. 4/2026 introduces additional restrictions. The consequences and available restructuring options depend on the actual documents and circumstances.
        href: /regulations#chg-h
        linkText: Understand Nominee Ownership Risks
      - question: I live abroad. Do I need to be in Bali?
        answer: Not necessarily. Initial document reviews, consultations and written assessments can be handled remotely. If a procedure requires your presence, notarised documents or a power of attorney, TCG can identify the requirements and help coordinate the process where legally permitted.
      - question: "[TEXT]"
        answer: "[TEXT]"
      - question: "[TEXT]"
        answer: "[TEXT]"
      - question: What if my property cannot be legalised?
        answer: We’ll tell you clearly. If the intended use cannot be approved, the audit explains why and evaluates alternatives such as redesign, another permitted use, project recovery or sale. The goal is to protect the remaining value of your investment rather than recommend further spending without a sound legal and financial basis.

