seo:
  title: Twins Consulting Group
  description: Verified data, capital access and development strategy for property investors in Bali.

blocks:
  # 1. Hero
  - type: hero
    illustration: home
    title: Verified data, capital access and development strategy for property investors in Bali
    lead: From the first document check to the closing, one accountable team carries your property decision.
    actions:
      - label: Check a Property
        href: /due-diligence#pricing
      - label: Book a Consultation
        message: book

  # 2. How TCG works: the three spheres flow up into TCG (no links on this screen)
  - type: flow
    tone: sunken
    title: Every decision we make runs on the same verified data
    lead: Property records in Indonesia sit in separate government systems. TCG reads them together for every asset and turns the result into three kinds of work.
    hub: TCG
    outputs:
      - title: Intelligence
        text: "For buyers and owners: a verified legal and technical picture of a property before money moves."
      - title: Advisory
        text: "For owners and developers: a plan to buy, finish, legalise, sell or launch, built on that picture."
      - title: Capital
        text: "For investors: placement only into assets that passed the check."

  # 3. Platform: the same architecture diagram as /platform (shared block), one button
  - type: architecture
    id: infrastructure
    tone: inverse
    title: The Infrastructure Behind Property Intelligence.
    head:
      - Data flow · Input → Processing → Output
      - Proprietary Intelligence Architecture
    columns:
      - Input layer
      - Processing layer
      - Output layer
    inputs:
      - title: BATARA + BPN / SIMBG
        text: Zoning · certificates · PBG / SLF
      - title: AHU + OSS
        text: Company records · registrations · licenses
      - title: TCG Market Data
        text: Developers · pricing · construction history
    engine:
      kicker: Core
      title: Property Intelligence Engine
      modules:
        - title: Data Integration
          text: Connects property, company and regulatory records
        - title: Risk Intelligence
          text: Identifies legal, development and commercial risks
        - title: Investment Screening
          text: Detects distressed and undervalued assets
    outputs:
      - title: Property Verification Reports
        text: Paid screening and risk review
      - title: Investment Opportunities
        text: Qualified acquisition candidates
      - title: Distressed Asset Pipeline
        text: Further investment analysis
    foot:
      - title: Traceable Intelligence
        text: Each finding is linked to available records and supporting evidence.
      - title: Risk Transparency
        text: Verified facts, potential risks and unresolved issues are distinguished.
      - title: Investment Advantage
        text: Property intelligence supports faster screening and capital allocation.
    action:
      label: Explore the platform
      href: /platform

  # 4. Advisory
  - type: cards
    tone: sunken
    title: Experience from both sides of Indonesian property deals
    lead: Five years across Indonesia, from land sales to cross-border investment deals. The same experience protects a buyer's money or shapes an owner's exit.
    columns: 3
    items:
      - title: Acquisition Advisory
        text: "You found a promising property with open questions: an unfinished build, a short land lease, permits that don't add up. We tell you what it is worth today, what it will cost to finish, whether to buy. You get a written memo your partners can rely on."
        href: /acquisition-advisory
      - title: Go-to-Market for Developers
        text: Your project is on sale while leads fail to convert, or it is still on paper with an untested price. We define the buyer, set the price grid, build the marketing plan, set up the sales team. You get a launch plan built on market data.
        href: /go-to-market
      - title: Land Monetization Strategy
        text: You own land without a profitable plan for it. We check what the zoning allows, what the market will pay, then choose the strongest use. You get a plan with numbers.
        href: /land

  # 5. Capital
  - type: cards
    title: We invest in what we verify
    lead: TCG puts its own money into property, raises capital from partners, prepares cross-border deals for investors. Each deal starts only after the asset passes the full set of checks we run for clients. We say this before any work begins, so every client knows where we stand.
    columns: 2
    items:
      - title: Stalled projects
        text: Owners who need a fast exit receive a firm offer.
        href: /distressed-property-buyout
      - title: Developer stock
        text: We buy unsold units in bulk at a discount, giving the developer cash for the next phase.
        href: /distressed-property-buyout
    link:
      label: Invest alongside TCG
      href: /platform
    fineprint:
      label: How we disclose our interest in a property
      href: /terms#conflict-of-interest

  # 6. Proof
  - type: metrics
    tone: sunken
    title: Proof you can check
    items:
      - value: 5+
        label: years in Indonesia
      - value: 10+
        label: years of total experience
      - value: "58"
        label: properties assessed
      - value: 150+
        label: hectares of land sold
    reach:
      title: Indonesia · UAE · Singapore · Hong Kong
      text: Deal structuring for cross-border investors.
    # Placeholders: the two cards below are not rendered until the quote, names and URLs are filled in.
    letter:
      title: Letter of thanks
      org: Sumbawa Property Trust
      quote: "[quote]"
      href: "[SPT website URL]"
    partners_title: Partners
    partners:
      - group: Notaries
        name: "[name]"
        href: "[URL]"
      - group: Lawyers
        name: "[name]"
        href: "[URL]"

  # 7. Testimonials and logos
  - type: testimonials
    title: Client Experiences
    items:
      - quote: Our villa was doing well, but the licensing situation was a real headache. TCG helped us sort everything out properly. We’re now renting it out legally and earning again. Such a relief.
        name: James Mitchell
        meta: Australia · Rental Villa
        photo: /assets/img/testimonials/james.webp
      - quote: We wanted to sell our villa, but an issue with the SLF was holding things up. TCG identified what needed to be done and helped us resolve it. The sale could finally move forward. Professional and efficient.
        name: Sophie Müller
        meta: Switzerland · Residential Villa
        photo: /assets/img/testimonials/sophie.webp
      - quote: Our contractor left us with a half-finished villa. We were seriously considering walking away. TCG assessed the project and showed us that finishing it made more financial sense. We completed construction and later sold the villa for a very good price. That advice made a huge difference.
        name: Alexey Morozov
        meta: Russia · Development Project
        photo: /assets/img/testimonials/alexey.webp
      - quote: I was very close to buying a property in Bali. Thankfully, I asked TCG to review the documents first. They uncovered a nominee ownership arrangement I hadn’t fully understood. I decided not to proceed. Money very well spent.
        name: Oliver Bennett
        meta: United Kingdom · Investment Property
        photo: /assets/img/testimonials/oliver.webp
      - quote: We had plans to develop our land, but weren’t certain what was actually permitted. TCG helped us understand the zoning restrictions and what we could realistically build. It gave us the clarity we needed before spending more money on the project.
        name: Thomas Weber
        meta: Germany · Development Land
        photo: /assets/img/testimonials/thomas.webp
  - type: logos
    title: Government Authorities & Regulatory Bodies
    items:
      - image: /assets/img/logos/logo-d7a21937e0.webp
        height: 64
        name: Provincial Government of Bali
      - image: /assets/img/logos/logo-8e18101765.webp
        height: 64
        name: Badung Regency Government
      - image: /assets/img/logos/logo-b5b9a1a914.webp
        height: 72
        name: Ministry of Agrarian Affairs and Spatial Planning / National Land Agency (ATR/BPN)
      - image: /assets/img/logos/logo-0ac2df6d61.webp
        height: 56
        name: Ministry of Investment and Downstream Industry / BKPM
      - image: /assets/img/logos/logo-7782e3c92f.webp
        height: 38
        name: Online Single Submission (OSS)
      - image: /assets/img/logos/logo-dc1ca2ae33.webp
        height: 60
        name: Ministry of Tourism of the Republic of Indonesia
      - image: /assets/img/logos/logo-a8e14bb403.webp
        height: 54
        name: Ministry of Law of the Republic of Indonesia
      - image: /assets/img/logos/logo-335bc15c73.webp
        height: 68
        name: Ministry of Environment / Environmental Control Agency
      - image: /assets/img/logos/logo-dc2865df38.webp
        height: 68
        name: Ministry of Forestry of the Republic of Indonesia
      - image: /assets/img/logos/logo-eab2de1599.webp
        height: 66
        name: Satpol PP (Civil Service Police Unit)
    disclaimer: TCG is an independent private consulting company. The government authorities shown are relevant to property-related regulatory and administrative procedures. Their logos are displayed for identification purposes only and do not imply any official partnership, affiliation, endorsement or guarantee of approval.

  # 9. FAQ: new questions to be provided. An empty list keeps the block here and renders nothing.
  - type: faq
    title: "[TEXT]"
    items: []

  # 8. Start where you are (replaces the choices and the all-services screens). Anchors #buyers and #owners.
  - type: services
    tone: inverse
    title: Start where you are
    lead: Choose the service that fits your situation, or talk it through with us first.
    explore: Explore
    groups:
      - id: buyers
        name: For buyers
        items:
          - title: Preliminary Due Diligence
            text: An online check of the property before you pay a deposit.
            meta: From US$90
            href: /due-diligence
          - title: Acquisition Advisory
            text: Guidance on a complex purchase, from price to final decision.
            meta: Individually scoped
            href: /acquisition-advisory
      - id: owners
        name: For owners and developers
        items:
          - title: Distressed Property Buyout
            text: A firm offer for a stalled project or unsold stock.
            meta: Individually scoped
            href: /distressed-property-buyout
          - title: Go-to-Market for Developers
            text: Positioning, pricing, sales setup for new or launched projects.
            meta: Individually scoped
            href: /go-to-market
          - title: Land Monetization Strategy
            text: A profitable plan for your land.
            meta: Individually scoped
            href: /land
    start:
      title: Not sure where to start?
      text: Tell us about your property and the issue you're facing. We'll help identify the next step.
      action:
        label: Message us on WhatsApp
        message: book

  # 11. Final CTA
  - type: cta
    tone: default
    title: Ask us anything about your property
    text: Send a message on WhatsApp. You get a straight answer from our team, with no commitment to continue.
    action:
      label: Message us on WhatsApp
      message: book
