      - part: note
        variant: tbl-note
        text: Category names follow the official Bali Provincial Government release. KBLI codes follow Indonesian media reports of the same list; each code is confirmed in OSS before filing.
      - part: heading
        text: What this means for property structures
        id: pma-structures
      - part: list
        variant: facts
        items:
          - title: Hotels, real estate and other accommodation
            text: New PT PMA registrations in these categories are closed in Bali.
          - title: Villa activity — KBLI 55203
            text: Listed separately in KBLI 2025. Its availability for a new PT PMA is confirmed live in OSS before a structure is set up.
          - title: Accommodation management — KBLI 55901
            text: KBLI 2020 code 55900 was split into several KBLI 2025 codes, including 55901. Its current status for a new PT PMA is confirmed live in OSS.
          - title: Existing PT PMA companies
            text: Licensed companies continue operating and file LKPM reports.
          - title: Land titles
            text: Perda Bali No. 4/2026 prohibits nominee land ownership. Every structure rests on a title or lease held in the investor’s or company’s own name.
  - type: guide
    id: operator
