                  - Actual intended activity against the applicable use and ITBX rules
              - cells:
                  - Intensity
                  - KDB, KLB, KDH, KTB, height, setbacks and other controls
              - cells:
                  - Special restrictions
                  - Coastal (Perda Bali No. 3/2026), productive land (Perda Bali No. 4/2026), protected rice fields, river, hazard, sacred, aviation and infrastructure provisions
              - cells:
                  - Formal spatial position
                  - Existing KKPR and its consistency with the intended use
            name: Zoning
          - rows:
              - cells:
                  - Building approval
                  - PBG or qualifying legacy IMB and approved function
              - cells:
                  - As-built condition
                  - Footprint, floors, area, additions and material differences
              - cells:
                  - Fitness
                  - Existing SLF or the applicable SLF process
            name: Building
          - rows:
              - cells:
                  - Operator
                  - Individual or company identity and contractual role
              - cells:
                  - Business licence
                  - NIB, KBLI 2025, OSS status and, for a PT PMA, the 2026 Bali category closure
              - cells:
                  - Tourism compliance
                  - Applicable tourism standards and sector requirements
            name: Business and licensing
          - rows:
              - cells:
                  - Local operation
                  - Tax registration, reporting and location-specific obligations
              - cells:
                  - Remediation
                  - Curable gaps, authority-dependent issues and potential blockers
            name: Operation and outcome
      - part: heading
        text: Each finding lands in one of three groups
      - part: results
        items:
          - kind: ok
            title: Confirmed
            text: Evidence supports compliance.
          - kind: cd
            title: Requires verification
            text: Formal authority, document or technical confirmation is still needed.
          - kind: mi
            title: Material issue
            text: Current evidence shows a potentially incompatible condition to resolve before lawful rental.
