    tone: sunken
    label: 08 / Operator and Tax
    chain:
      - 4
      - 6
    title: Management companies and local tax
    heading_id: mg-h
    answer: A licensed management company covers the operator layer. The property itself carries its own zoning and building compliance.
    parts:
      - part: prose
        paragraphs:
          - "KBLI 2025 recognizes third-party accommodation management under **55901 Aktivitas Jasa Manajemen Akomodasi**. Operational compliance combines both halves:"
      - part: formula
        items:
          - Property and building compliance
          - +
          - Operator and business compliance
          - =
          - Operational compliance
      - part: taxbox
        label: Operation
        title: Local tax registration
        paragraphs:
          - Local tax registration and reporting form their own compliance layer, alongside the national NIB.
          - The exact obligations depend on location and operating model. For Badung properties, the operator confirms registration, collection and reporting with the competent local authority.
        id: local-tax
  - type: guide
    id: changes-2026
    nav: changes-2026
    tone: inverse
    label: 09 / 2026 Updates
    title: What changed in 2026
    heading_id: chg-h
    lead: New provincial and national rules, the PT PMA closure and active enforcement now shape every property audit.
    parts:
      - part: timeline
        items:
          - title: Perpres No. 4/2026 on protected rice fields
            text: Accelerates mapping of protected rice fields (LSD) and controls their conversion. Replaces Perpres No. 59/2019.
            tag:
              label: In force
              kind: law
            when: 4 February 2026
          - title: Perda Bali No. 4/2026 on productive land and nominee ownership
            text: Controls conversion of productive land to commercial use, including villas, prohibits nominee land ownership and sets criminal sanctions. [Zoning section](#special-restrictions)
            tag:
              label: In force
              kind: law
            when: 23 February 2026
          - title: Perda Bali No. 3/2026 on beaches and coastal setbacks
            text: Protects beaches and coastal setback zones; coastal properties are checked against it.
            tag:
              label: In force
              kind: law
            when: "2026"
          - title: Bali asks Airbnb to delist non-compliant businesses
            text: The Bali Provincial Government called on Airbnb to remove tourism businesses operating outside licensing and tax rules.
            tag:
              label: Enforcement
              kind: enf
            when: February 2026
          - title: Bali Kerthi Compliance Audit
            text: The Bali Provincial Tourism Office collects licensing and quality-standard information from tourism accommodation businesses.
            tag:
              label: Enforcement
              kind: enf
            when: April 2026
          - title: OSS closed to new PT PMA in 18 categories
            text: Covers hotels, real estate, other accommodation, consulting, rentals, retail and more. [Full list](#foreign-owners)
            tag:
              label: Implementation
              kind: impl
            when: From the third week of May 2026
          - title: OTA licence verification API
            text: The Ministry of Tourism is building an API with OTA partners to verify NIB and KBLI data for listed accommodation. Enforcement cooperation with OTA partners runs alongside it.
            tag:
              label: Future system
              kind: future
            when: Announced May 2026 · launch target June 2027
          - title: Kuta Selatan RDTR 2026–2046 in public consultation
            text: Perbup Badung No. 59/2021 applies until the new plan is formally adopted. [Details](#kuta-selatan)
            tag:
              label: Draft
              kind: draft
            when: September–October 2026
      - part: heading
        text: Legal base in force in 2026
        variant: base
      - part: list
        variant: base
