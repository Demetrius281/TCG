  - type: faq
    id: faq
    layout: stack
    nav: faq
    tone: sunken
    json_ld: false
    label: 11 / FAQ
    heading_id: faq-h
    title: Quick answers
    items:
      - question: What does an NIB cover?
        answer: NIB is the business identity issued through OSS. Legal rental also requires zoning, building and activity-specific licensing — see [the compliance chain](#short-answer).
      - question: Is my old IMB still valid?
        answer: Potentially. An IMB issued before PP No. 16 of 2021 can remain relevant for a completed building in its original configuration. [Legacy IMB](#imb)
      - question: What is the current KBLI code for a villa?
        answer: 55203 Aktivitas Vila under KBLI 2025, converted 1:1 from legacy code 55193. [KBLI codes](#nib-kbli)
      - question: Can a PT PMA still register a business in Bali?
        answer: Yes, for activities outside the 18 categories closed in OSS since May 2026. Each activity is confirmed live in OSS before setup. [The 18 categories](#foreign-owners)
      - question: Which Kuta Selatan plan applies today?
        answer: Perbup Badung No. 59/2021, the RDTR for 2021–2041. The 2026–2046 replacement applies from its formal adoption. [Kuta Selatan](#kuta-selatan)
      - question: Do Airbnb and Booking.com verify licences?
        answer: The Ministry of Tourism is building an OSS-linked verification API with OTA partners, with launch targeted for June 2027. Enforcement cooperation with OTA partners already runs. [2026 updates](#changes-2026)
