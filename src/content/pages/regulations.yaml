  - type: guide
    nav: short-answer
    tone: inverse
    label: 01 / The Compliance Chain
    title: "Bali Property Legality: The Short Answer"
    heading_id: sa-h
    lead: A Bali property is assessed through six connected layers. Each document confirms one layer, and legal rental requires all six.
    parts:
      - part: chain
        items:
          - title: LAND
            text: Lawful control of the property for the intended arrangement.
          - title: ZONING
            text: The intended accommodation activity is permitted on this parcel.
          - title: BUILDING
            text: PBG or qualifying legacy IMB, and SLF for fitness of use.
          - title: BUSINESS
            text: The legal operator of the accommodation and its role.
          - title: LICENSING
            text: NIB, current KBLI, risk-based licensing and supporting approvals.
          - title: OPERATION
            text: Tourism standards, local tax and other ongoing obligations.
    id: short-answer
  - type: guide
    tone: sunken
    nav: short-answer
    parts:
      - part: heading
        text: Each layer, its documents and what they confirm
        id: layers-h
      - part: table
        variant: layers
        columns:
          - Layer
          - Documents
          - What they confirm
        groups:
          - rows:
              - cells:
                  - 1 — Land
                  - Land certificate, lease or other control document
                  - The owner or operator lawfully controls the property for the intended arrangement.
              - cells:
                  - 2 — Zoning
                  - RTRW, RDTR, ITBX activity rules, special provisions, KKPR where applicable
                  - The intended accommodation activity is spatially supportable on this parcel.
              - cells:
                  - 3 — Building
                  - PBG or qualifying legacy IMB with approved plans; SLF
                  - The building is approved for its function and the completed building is fit for use.
              - cells:
                  - 4 — Business
                  - Operator entity (individual, PT or PT PMA) and its contracts with the owner
                  - The legal operator of the accommodation and its role.
              - cells:
                  - 5 — Licensing
                  - NIB, current KBLI 2025 code, risk-based licensing, supporting approvals
                  - The operator is licensed for the activity it actually runs.
              - cells:
                  - 6 — Operation
                  - Tourism business standards, local tax registration and reporting
                  - The business stays compliant while it operates.
      - part: note
        variant: pull
        text: "The working question: can this parcel, this building and this operator lawfully perform this specific short‑term accommodation activity?"
  - type: guide
    id: short-term-legal
    nav: short-answer
    label: 02 / Overview
    title: Is short‑term rental legal in Bali?
    heading_id: stl-h
    answer: Yes. Short‑term accommodation is a regulated business activity in Indonesia.
    parts:
      - part: prose
        paragraphs:
          - "Indonesian business and tourism frameworks recognize accommodation activities, including villa activity. Each property is assessed individually: the intended use must fit the spatial rules, the building must comply with the building regime, and the operator must hold the licensing for the business it actually runs."
          - An OTA listing, an NIB or a zoning map each confirms one part of that picture. Legal status comes from the complete compliance chain above.
  - type: guide
    id: zoning
    tone: sunken
    nav: zoning
    label: 03 / Zoning
    chain:
      - 2
    title: Zoning, RDTR, RTRW and KKPR
    heading_id: zon-h
    answer: Zoning confirms whether your intended activity is permitted on your specific parcel under the plan currently in force.
    parts:
      - part: prose
        paragraphs:
          - A zoning review identifies the legally applicable spatial plan, then checks the parcel’s subzone, the activity rules, development intensity and any special provisions affecting the site.
      - part: terms
        variant: defs
        items:
          - abbr: RTRW
            full: Rencana Tata Ruang Wilayah
            text: The broader regional spatial plan.
          - abbr: RDTR
            full: Rencana Detail Tata Ruang
            text: The detailed spatial plan and zoning instrument.
          - abbr: KKPR
            full: Kesesuaian Kegiatan Pemanfaatan Ruang
            text: Confirms that a proposed spatial-use activity conforms to the applicable spatial plan.
      - part: heading
        text: How ITBX classifies each activity
        id: itbx
      - part: prose
        paragraphs:
          - "Bali’s official spatial-planning guidance assigns every activity in every zone one of four codes:"
      - part: codes
        items:
          - kind: i
            letter: I
            title: I — Permitted
            text: The activity is compatible with the zone.
          - kind: t
            letter: T
            title: T — Limited
            text: The activity is allowed within defined limits.
          - kind: b
            letter: B
            title: B — Conditional
            text: The activity is allowed once specified conditions are met.
          - kind: x
            letter: X
            title: X — Prohibited
            text: The activity is excluded from that zone.
      - part: note
        variant: callout
        strong: Each activity is checked against the zone rules.
        text: The map colour shows the zone; the ITBX table for that zone shows which activities it allows.
      - part: heading
        text: "Development intensity: KDB, KLB, KDH, KTB"
        id: intensity
      - part: prose
        paragraphs:
          - Each subzone sets its own limits on footprint, floor area, green space and basement coverage, together with building lines, setbacks, height and access. The values come from the plan in force for the parcel.
      - part: terms
        variant: coef
        items:
          - abbr: KDB
            full: Koefisien Dasar Bangunan
            text: Building footprint and site coverage.
          - abbr: KLB
            full: Koefisien Lantai Bangunan
            text: Total floor area relative to the parcel.
          - abbr: KDH
            full: Koefisien Dasar Hijau
            text: Green and open-space share.
          - abbr: KTB
            full: Koefisien Tapak Basement
            text: Basement site coverage where applicable.
      - part: heading
        text: Special spatial restrictions
        id: special-restrictions
      - part: prose
        paragraphs:
          - "Depending on the coordinates and local plan, a screening covers issues such as:"
      - part: list
        variant: restr
        items:
          - Coastal and shoreline controls
          - River setbacks
          - Flood, tsunami, landslide and other hazard layers
          - Protected agricultural land and protected rice fields
          - Protected forest
          - Heritage and sacred-area provisions
          - Aviation / KKOP restrictions
          - Road reservations and planned infrastructure
          - Water-catchment and other special planning provisions
      - part: note
        variant: sub-lead
        text: "Three regulations issued in 2026 tighten these controls:"
      - part: cards
        variant: rules
        items:
          - tag:
              label: In force
              kind: law
            kicker: Productive land and nominee ownership · in force since 23 February 2026
            title: Perda Bali No. 4/2026
            text: Controls conversion of productive agricultural land to commercial use, including villas, and prohibits nominee land ownership. Violations carry criminal sanctions.
          - tag:
              label: In force
              kind: law
            kicker: Beaches and coastal setbacks
            title: Perda Bali No. 3/2026
            text: Protects beaches and coastal setback zones (sempadan pantai). Every coastal property is checked against it.
          - tag:
              label: In force
              kind: law
            kicker: Protected rice fields · issued 4 February 2026
            title: Perpres No. 4/2026
            text: National regulation that accelerates mapping of protected rice fields (LSD) and controls their conversion. It replaces Perpres No. 59/2019.
      - part: heading
        text: Parcels in more than one zone
        id: multiple-zones
      - part: prose
        paragraphs:
          - Each zone on the parcel is assessed separately. The analysis starts from the building footprint, the proposed use and the boundary of each zoning or special-provision area.
      - part: heading
        text: How to check Bali zoning online
        id: check-zoning-online
      - part: prose
        paragraphs:
          - "Official portals give a reliable first screening:"
      - part: list
        variant: tools
        items:
          - title: BHUMI ATR/BPN
            text: National ATR/BPN mapping with parcel and spatial context.
          - title: BATARA Badung
            text: Badung spatial tools, including land-field, RDTR/RTRW and KKPR-related functions.
          - title: TARUBALI
            text: Bali spatial-planning information, plan status and zoning material.
          - title: Satu Data Bali
            text: Provincial datasets and spatial layers.
      - part: screen
        columns:
          - title: Online screening shows
            items:
              - The zone and subzone of the parcel
              - The status of the applicable plan
              - Hazard and special-provision layers
          - title: Confirmed through documents and specialists
            items:
              - Certificate boundaries against the actual site — BPN measurement
              - Whether the lease permits the business model — notarial / PPAT review
              - Validity of an old IMB after alterations — SIMBG
              - Building conformity with approved plans and SLF eligibility — technical review
              - Eligibility of a foreign-investment structure — live OSS check
      - part: heading
        text: "Kuta Selatan: the plan in force and the draft"
        id: kuta-selatan
      - part: prose
        paragraphs:
          - "As of 28 October 2026, **Perbup Badung No. 59 of 2021** is the published detailed spatial plan for Kuta Selatan 2021–2041. Its replacement, **RDTR WP Kuta Selatan 2026–2046**, is in preparation: first-stage public consultation took place in late September 2026 and was published by Kuta Selatan authorities on 1 October 2026."
      - part: cards
        variant: plan
        items:
          - tag:
              label: In force
              kind: law
            kicker: Current enacted plan
            title: Perbup Badung No. 59/2021 — RDTR Kuta Selatan 2021–2041
            text: Properties are audited against this plan today.
          - tag:
              label: Draft
              kind: draft
            kicker: Replacement in preparation
            title: RDTR WP Kuta Selatan 2026–2046
            text: Applies from formal adoption; monitored now as future regulatory risk.
            draft: true
  - type: guide
    id: building
    nav: building
    label: 04 / Building
    chain:
      - 3
    title: PBG, SLF and legacy IMB
    heading_id: pbg-h
    answer: PBG approves the building. SLF confirms the completed building is fit for its approved function.
    parts:
      - part: prose
        paragraphs:
          - "**PBG — Persetujuan Bangunan Gedung** is the approval used under Indonesia’s post-2021 building regime for construction and building works that follow approved technical requirements."
          - "For an existing property, the audit compares the approval with the building as it stands today:"
      - part: list
        variant: checks
        items:
          - Approved function
          - Footprint
          - Floor area
          - Number of floors
          - Configuration
          - Extensions
          - Major alterations
          - Approved drawings and as-built condition
      - part: compare
        items:
          - kind: pbg
            abbr: PBG
            full: Persetujuan Bangunan Gedung
            rows:
              - label: Confirms
                value: Approval of the building and its technical plan
              - label: Focus
                value: "What is approved: function, design and configuration"
          - kind: slf
            abbr: SLF
            full: Sertifikat Laik Fungsi
            rows:
              - label: Confirms
                value: Fitness of the completed building for use
              - label: Focus
                value: The completed building and its approved function
      - part: heading
        text: Legacy IMB
        id: imb
      - part: prose
        paragraphs:
          - "IMB was the building permit used before PP No. 16 of 2021 introduced PBG. Official SIMBG guidance sets out two situations:"
      - part: cards
        variant: imb
        items:
          - kicker: IMB issued before PP No. 16/2021 · building completed · original configuration kept
            title: IMB may remain valid
            text: The IMB continues to cover the building as originally approved and built.
          - kicker: IMB issued · construction started under the new regime
            title: Apply for PBG
            text: SIMBG guidance directs these projects to PBG.
  - type: guide
    id: existing
    nav: existing
    tone: sunken
    label: 05 / Existing Properties
    chain:
      - 2
      - 3
    title: How an existing property is legalized
    heading_id: ex-h
    answer: Official SIMBG guidance provides an existing-building route that can issue PBG and SLF together once the building meets the applicable requirements.
    parts:
      - part: prose
        paragraphs:
          - "Feasibility depends on whether:"
      - part: list
        variant: feas
        items:
          - the intended use is spatially supportable;
          - the building position complies with applicable restrictions;
          - the built form can satisfy intensity and technical requirements;
          - structural and technical compliance can be demonstrated;
          - deviations from required or approved conditions can be corrected;
          - the intended function can lawfully be recognized.
      - part: heading
        text: Common scenarios
        id: scenarios
      - part: table
        variant: scenarios
        columns:
          - Scenario
          - What it means
          - Audit response
        groups:
          - rows:
              - cells:
                  - Building completed, PBG and IMB missing
                  - Documentation gap; the existing-building route may apply
                  - Spatial and technical feasibility first
              - cells:
                  - Old IMB on file
                  - May remain relevant
                  - Verify date, construction status, function, changes and drawings
              - cells:
                  - PBG function differs from the intended use
                  - Function mismatch
                  - Determine the lawful amendment or change route
              - cells:
                  - Building differs from approved drawings
                  - As-built mismatch
                  - Architectural and technical review before the SLF application
              - cells:
                  - SLF missing
                  - Fitness-for-use evidence incomplete
                  - Determine the applicable SLF process
              - cells:
                  - Zone excludes accommodation activity
                  - Potential fundamental spatial blocker
                  - Resolve the formal spatial position before licensing
              - cells:
                  - Parcel crosses zones or overlays
                  - Boundary-specific risk
                  - Parcel-level spatial analysis and formal confirmation where required
              - cells:
                  - Coastal, river, sacred, aviation or productive-land restriction
                  - Additional planning control
                  - Analyse the exact provision, including Perda Bali No. 3/2026 and No. 4/2026
      - part: heading
        text: The legalization sequence
        id: legalization-steps
      - part: path
        items:
          - step_label: STEP
            step: A
            title: Identify the parcel and legal control
            text: Confirm coordinates, land documents, certificate or lease references and the relationship between the property controller and the future operator.
            zone: LAND
          - step_label: STEP
            step: B
            title: Establish the current spatial position
            text: Identify the effective RTRW/RDTR, subzone, ITBX treatment for the intended activity, development intensity and special provisions.
            zone: ZONING
          - step_label: STEP
            step: C
            title: Compare building documents with the building
            text: Review PBG or qualifying legacy IMB, approved plans and the as-built property.
            zone: BUILDING
          - step_label: STEP
            step: D
            title: Determine the SLF route
            text: Establish whether the completed building can satisfy the existing-building or standard SLF process.
            zone: BUILDING
          - step_label: STEP
            step: E
            title: Establish the legal operator
            text: Once the property pathway is clear, finalize the operating entity, current KBLI and OSS licensing structure.
            zone: BUSINESS / LICENSING
          - step_label: STEP
            step: F
            title: Complete sector, tax and operating compliance
            text: Resolve applicable tourism standards, supporting approvals, local tax and live operating obligations.
            zone: OPERATION
  - type: guide
    id: nib-kbli
    tone: sunken
    nav: nib-kbli
    label: 06 / Business Licensing
    chain:
      - 4
      - 5
    title: NIB, OSS and the current villa KBLI
    heading_id: nib-h
    answer: NIB is the business identity issued through OSS. The KBLI code attached to it matches the activity the business actually runs.
    parts:
      - part: heading
        text: The current villa code
        id: kbli-2026
      - part: kbli_shift
        old:
          code: "55193"
          title: Vila — KBLI 2020
          note: Legacy code
        arrow: 1:1
        current:
          code: "55203"
          title: Aktivitas Vila — KBLI 2025
          note: Current code
      - part: prose
        paragraphs:
          - "Official OSS converts legacy villa code **55193 1:1 to 55203**. Accommodation codes under KBLI 2025:"
      - part: table
        variant: kbli
        columns:
          - KBLI 2025
          - Activity
          - KBLI 2020 reference
          - Used for
        groups:
          - rows:
              - cells:
                  - "55203"
                  - "**Aktivitas Vila**"
                  - ~~55193~~
                  - Villa accommodation run as a villa business
                highlight: true
              - cells:
                  - "55201"
                  - "**Aktivitas Rumah Tinggal Sewa (Homestay)**"
                  - ~~55130~~^^Pondok Wisata^^
                  - Homestay-type short stays
              - cells:
                  - "55901"
                  - "**Aktivitas Jasa Manajemen Akomodasi**"
                  - ~~55900~~^^split into several codes^^
                  - Third-party management of accommodation owned by others
      - part: split
        items:
          - title: The code follows the activity
            paragraphs:
              - Indonesian licensing classifies a property by the activity the business runs day to day, whatever label the OTA listing uses.
            id: activity-rule
          - title: Tourism business standards
            paragraphs:
              - "**Permenpar No. 6 of 2025** sets the current risk-based standards for tourism businesses."
            id: tourism-standards
      - part: note
        variant: sub-lead
        text: "The licensing sequence:"
      - part: list
        variant: steps4
        items:
          - Identify the actual activity
          - Select the current KBLI 2025 code
          - Check the live OSS obligations for that activity and operator
          - Meet the applicable sector and supporting requirements
  - type: guide
    id: foreign-owners
    nav: foreign-owners
    label: 07 / PT PMA and Foreign Owners
    chain:
      - 4
    title: What a PT PMA can register in Bali in 2026
    heading_id: fo-h
    answer: Since the third week of May 2026, OSS in Bali is closed to new PT PMA registrations in 18 low and medium-low risk business categories.
    parts:
      - part: prose
        paragraphs:
          - The Bali Provincial Government announced the measure on 22 July 2026, after approval from the Minister of Investment and Downstreaming / BKPM. It applies across the province until further policy is issued. PT PMA companies already licensed in these categories keep their licences and continue to file LKPM investment reports.
      - part: heading
        text: The 18 closed categories
        id: closed-categories
      - part: table
        variant: pma
        columns:
          - KBLI
          - Category
        groups:
          - rows:
              - cells:
                  - "55110"
                  - Star hotels with building area under 6,000 m²
                highlight: true
              - cells:
                  - Confirm in OSS
                  - Melati hotels
                highlight: true
              - cells:
                  - Confirm in OSS
                  - Real estate, owned or leased
                highlight: true
              - cells:
                  - "55900"
