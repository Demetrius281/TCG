  # 06 FAQ
  - type: faq
    id: faq
    layout: split
    json_ld: false
    title: Questions Buyers Ask Before Ordering.
    items:
      - question: Does Preliminary Due Diligence replace a full legal review?
        answer: TCG Preliminary Due Diligence covers many of the same areas, including zoning, building permits, land rights, company registration and business licensing. However, it is an online records-based assessment, not a formal legal opinion or a substitute for detailed title verification at the land office.
      - question: Which areas and property types do you cover?
        answer: Currently focused on Badung, Bali. The service covers land plots, completed villas, unfinished properties and off-plan developments. Available checks depend on the selected plan and accessible records.
      - question: Do I need documents to order?
        answer: No. A property location and the requested seller details are enough to get started. Providing a land certificate, PBG, SLF or company documents allows additional cross-checks. Any limitations will be clearly identified in the report.
      - question: What if an official record is unavailable?
        answer: The finding is marked “Not Verified”, with an explanation and recommended next steps. Missing records are never treated as proof that a property is either legally compliant or non-compliant.
      - question: How fast will I receive the report?
        answer: Basic reports are delivered within 12 hours, Standard within 24 hours and Comprehensive within 48 hours. Your report arrives by email with findings, identified risks and recommended next steps.
      - question: Can I check a property before paying a deposit?
        answer: Yes. TCG Preliminary Due Diligence is designed to identify potential problems before transferring money, signing agreements or committing to expensive legal procedures.

